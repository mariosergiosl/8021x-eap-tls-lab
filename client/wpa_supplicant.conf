# ======================================================================================
# FILE: /etc/wpa_supplicant/wpa_supplicant.conf
# USAGE: wpa_supplicant -c /etc/wpa_supplicant/wpa_supplicant.conf -i <INTERFACE> -D wired
# DESCRIPTION: 802.1X Supplicant configuration for wired EAP-TLS authentication.
# OPTIONS: Paths configured for SLES 15 default wpa_supplicant directory.
# AUTHOR: Mario Luz
# VERSION: 1.0
# ======================================================================================

ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=root
eapol_version=2
ap_scan=0

network={
    key_mgmt=IEEE8021X
    eap=TLS
    identity="endpoint-client.lab.local"
    ca_cert="/etc/wpa_supplicant/ca-lab.crt"
    client_cert="/etc/wpa_supplicant/client.crt"
    private_key="/etc/wpa_supplicant/client.key"
    eapol_flags=0
}

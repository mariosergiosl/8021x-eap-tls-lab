# =============================================================================
# wpa_supplicant_tpm.conf — Configuração EAP-TLS com chave no TPM 2.0
#
# Stack: tpm2-pkcs11 + openssl-engine-libp11 (SLES 16 / OpenSSL 3.5)
#
# Pré-requisito:
#   export TPM2_PKCS11_STORE=/etc/tpm2-pkcs11
#
# Execução:
#   export TPM2_PKCS11_STORE=/etc/tpm2-pkcs11
#   wpa_supplicant -D wired -i enp0s3 -c /etc/wpa_supplicant/wpa_supplicant_tpm.conf
#
# Arquivos necessários no cliente:
#   /etc/wpa_supplicant/ca-lab.crt          <- CA do servidor
#   /etc/wpa_supplicant/tpm/client-tpm.crt  <- certificado cliente assinado pela CA
#
# O par de chaves fica no TPM — nunca em arquivo.
# =============================================================================

ctrl_interface=/var/run/wpa_supplicant
eapol_version=2
ap_scan=0

network={
    key_mgmt=IEEE8021X
    eap=TLS
    identity="endpoint-client.lab.local"

    # CA do servidor (hostapd)
    ca_cert="/etc/wpa_supplicant/ca-lab.crt"

    # Certificado do cliente (assinado pela CA, gerado a partir do CSR TPM)
    client_cert="/etc/wpa_supplicant/tpm/client-tpm.crt"

    # Chave privada via URI PKCS#11 — a chave reside no TPM
    # O wpa_supplicant usa o engine 'pkcs11' (openssl-engine-libp11)
    # que acessa o token via tpm2-pkcs11
    private_key="pkcs11:token=endpoint-tpm;object=endpoint-client-key;type=private;pin-value=1234"
    private_key_passwd="1234"
}
